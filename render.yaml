services:
  - type: web
    name: newscred-web
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: newscred
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
