<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsCred | Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        NewsCred
      </a>
      <div class="nav-links">
        <a href="login.html" class="btn btn-secondary" style="padding: 8px 16px;">Log In</a>
      </div>
    </div>
  </nav>

  <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px);">
    <div class="glass-card" style="width: 100%; max-width: 400px; padding: 40px; margin-top: -80px;">
      <h2 style="text-align: center; margin-bottom: 24px;">Create Account</h2>
      <form class="flex-col gap-4">
        <div class="flex-col gap-2">
          <label style="font-size: 0.875rem; font-weight: 600; color: var(--text-secondary);">Email</label>
          <input type="email" class="input-field" placeholder="Enter your email" required style="padding: 12px 16px;">
        </div>
        <div class="flex-col gap-2">
          <label style="font-size: 0.875rem; font-weight: 600; color: var(--text-secondary);">Password</label>
          <input type="password" class="input-field" placeholder="Create a password" required style="padding: 12px 16px;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px; padding: 14px;">Sign Up</button>
      </form>
      <p style="text-align: center; margin-top: 24px; font-size: 0.875rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" style="color: var(--color-blue); text-decoration: none; font-weight: 600;">Log in</a>
      </p>
    </div>
  </main>
</body>
</html>
